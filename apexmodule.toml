# What makes this directory an ApexBuild module. See MODULE_CONTRACT.md.

[module]
id       = "jedisyslogger"
name     = "APEX JediSyslogger"
version  = "1.2.4"
summary  = "SIEM log-ingestion simulator — 83 attacks, 56 appliance formats, live syslog forwarding."
icon     = "JS"
accent   = "#39ff88"
contract = 1
order    = 60

[run]
launcher      = "apexmod"
health        = "/status"
ready_timeout = 40
embeddable    = true

[sync]
# Credentials, TLS material, build output and captured log samples.
# None of it belongs in a copy of this module.
exclude = ["auth.json", "certs/", ".run/", "dist/", "node_modules/", "*.log", "*.key"]
